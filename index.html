<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b5b">
<title>ASAGIRI DAYS｜朝霧高原観光ナビ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="shade"></div>
  <div class="hero-inner">
    <div class="eyebrow">FUJINOMIYA • ASAGIRI KOGEN</div>
    <h1>ASAGIRI DAYS</h1>
    <p>朝霧高原だけを、気持ちよく巡る。</p>
    <div class="hero-actions">
      <button id="browseBtn" class="btn light">✨ おすすめを見る</button>
      <button id="mapBtn" class="btn glass">🗺 スポットマップ</button>
    </div>
  </div>
</header>
<main>
  <section class="search-panel">
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="施設名・エリア・キーワードで検索">
      <button id="clearBtn">×</button>
    </div>
    <div id="chips" class="chips"></div>
  </section>

  <section class="quick-grid">
    <button data-quick="牧場">🐄<span>牧場</span></button>
    <button data-quick="グルメ">🍽️<span>グルメ</span></button>
    <button data-quick="キャンプ">⛺<span>キャンプ</span></button>
    <button data-quick="自然">🌿<span>自然</span></button>
    <button data-quick="買い物">🛍️<span>買い物</span></button>
    <button data-quick="体験">🎟️<span>体験</span></button>
  </section>

  <section class="toolbar">
    <div><strong id="resultCount">0</strong><span>スポット</span></div>
    <select id="sortSelect">
      <option value="featured">おすすめ順</option>
      <option value="name">名前順</option>
    </select>
  </section>

  <section id="spotList" class="spot-list"></section>

  <section class="note">
    <h2>朝霧高原を楽しむコツ</h2>
    <p>富士山を近くに感じながら、牧場・キャンプ・高原グルメ・自然体験をゆったり楽しめるエリアです。天候が変わりやすいため、当日の営業時間・入場条件・道路状況は各施設の公式情報で確認してください。</p>
  </section>
</main>

<dialog id="detailDialog">
  <button id="closeDetail" class="close">×</button>
  <div id="detailContent"></div>
</dialog>

<dialog id="mapDialog" class="map-dialog">
  <button id="closeMap" class="close">×</button>
  <div class="map-wrap">
    <h2>朝霧高原スポットマップ</h2>
    <p>ピンを押すと施設詳細を開きます。</p>
    <div id="mapCanvas" class="map-canvas"></div>
  </div>
</dialog>

<nav class="bottom-nav">
  <button class="active" data-nav="home">🏠<span>ホーム</span></button>
  <button data-nav="search">🔎<span>探す</span></button>
  <button data-nav="fav">♥<span>お気に入り</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
